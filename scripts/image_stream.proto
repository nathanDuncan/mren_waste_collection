syntax = "proto3";

message ImageFrame {
  // Compressed image data
  bytes colour_data = 1;      // JPEG compressed
  bytes depth_data = 2;      // Raw or compressed (e.g. zlib) 16-bit depth

  // Image metadata
  int32 width = 3;
  int32 height = 4;
  double timestamp = 5;

  // Camera Intrinsics (needed for 3D projection)
  float fx = 6;
  float fy = 7;
  float ppx = 8;
  float ppy = 9;
  
  // RealSense depth scale (meters per unit)
  float depth_scale = 10;
}
